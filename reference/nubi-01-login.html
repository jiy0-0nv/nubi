<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>NUBI MYOBI — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --surface:#0b1016; --surface-2:#111821; --surface-3:#0d141c;
  --line:rgba(120,170,190,.14); --line-strong:rgba(120,170,190,.22);
  --text:#eef4f7; --text-2:#c3d2da; --text-3:#8b98a6; --text-4:#5b7180;
  --cyan:#5ee0ee; --cyan-ink:#05161a; --blue:#3b7fd4;
  --pink:#ff5ea8; --yellow:#ffd23f; --green:#3fd18a; --violet:#a06ee8;
  --sans:'Gothic A1',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Bungee',var(--sans);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;}
a{color:var(--cyan);text-decoration:none;}
a:hover{color:#9af1f9;}
.page{width:1440px;margin:0 auto;background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden;}
</style>
</head>
<body>
<main class="page" style="height:820px;display:flex;">
  <div style="width:620px;flex:none;position:relative;overflow:hidden;background:linear-gradient(170deg,#0e1a24,#0a0f15);border-right:1px solid rgba(120,170,190,.14);padding:48px;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:24px;height:26px;border-radius:12px 12px 3px 3px;background:#5ee0ee;"></div>
      <span style="font:400 17px/1 'Bungee',sans-serif;color:#eef4f7;white-space:nowrap;">NUBI MYOBI</span>
    </div>
    <div style="margin-top:auto;position:relative;z-index:2;">
      <div style="font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:#3fd18a;margin-bottom:16px;white-space:nowrap;">WORLD'S OLDEST BEDROOMS</div>
      <h2 style="margin:0 0 14px;font:800 38px/1.24 'Gothic A1',sans-serif;color:#f4f8fa;text-wrap:balance;">4,600년 된 방이<br>당신을 기다립니다</h2>
      <p style="margin:0;font:400 14px/1.75 'Gothic A1',sans-serif;color:#8b98a6;max-width:400px;">등록 묘소 1,204곳 · 41개국 · 최고 연식 6,600만 년</p>
    </div>
    <div style="position:absolute;top:120px;right:-40px;width:150px;height:150px;border-radius:999px;background:#ffd23f;opacity:.9;"></div>
    <div style="position:absolute;top:120px;right:-2px;width:150px;height:150px;border-radius:999px;background:#0d1620;"></div>
    <div style="position:absolute;bottom:-1px;right:56px;width:0;height:0;border-left:96px solid transparent;border-right:96px solid transparent;border-bottom:124px solid rgba(94,224,238,.14);"></div>
    <div style="position:absolute;bottom:-1px;right:216px;width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:80px solid rgba(94,224,238,.08);"></div>
  </div>

  <div style="flex:1;min-width:0;padding:64px 88px;display:flex;flex-direction:column;justify-content:center;">
    <div style="display:flex;gap:26px;border-bottom:1px solid rgba(120,170,190,.14);margin-bottom:34px;">
      <div style="padding:0 2px 14px;border-bottom:2px solid #5ee0ee;font:800 15px/1 'Gothic A1',sans-serif;color:#eef4f7;white-space:nowrap;">로그인</div>
      <div style="padding:0 2px 14px;font:600 15px/1 'Gothic A1',sans-serif;color:#7e8d9a;white-space:nowrap;">회원가입</div>
    </div>
    <label style="display:block;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#6d8494;margin-bottom:9px;white-space:nowrap;">이메일</label>
    <div style="height:52px;border-radius:11px;background:#111821;border:1px solid rgba(94,224,238,.35);display:flex;align-items:center;padding:0 16px;margin-bottom:20px;">
      <span style="font:500 14px/1 'Gothic A1',sans-serif;color:#eef4f7;white-space:nowrap;">nubi@example.com</span>
      <div style="width:1px;height:18px;background:#5ee0ee;margin-left:2px;"></div>
    </div>
    <label style="display:block;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#6d8494;margin-bottom:9px;white-space:nowrap;">비밀번호</label>
    <div style="height:52px;border-radius:11px;background:#111821;border:1px solid rgba(120,170,190,.22);display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:16px;">
      <span style="font:500 15px/1 'IBM Plex Mono',monospace;color:#8b98a6;letter-spacing:.24em;white-space:nowrap;">••••••••••</span>
      <span style="font:600 12px/1 'Gothic A1',sans-serif;color:#5ee0ee;white-space:nowrap;">표시</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:17px;height:17px;border-radius:5px;background:#5ee0ee;display:flex;align-items:center;justify-content:center;font:800 11px/1 'Gothic A1',sans-serif;color:#05161a;">✓</div>
        <span style="font:500 13px/1 'Gothic A1',sans-serif;color:#b6c5cf;white-space:nowrap;">로그인 상태 유지</span>
      </div>
      <span style="font:500 13px/1 'Gothic A1',sans-serif;color:#8b98a6;white-space:nowrap;">비밀번호 찾기</span>
    </div>
    <div style="height:54px;border-radius:11px;background:#5ee0ee;display:flex;align-items:center;justify-content:center;font:800 15px/1 'Gothic A1',sans-serif;color:#05161a;white-space:nowrap;">누비러 들어가기</div>
    <div style="display:flex;align-items:center;gap:14px;margin:26px 0;">
      <div style="flex:1;height:1px;background:rgba(120,170,190,.16);"></div>
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;color:#5b7180;white-space:nowrap;">OR</span>
      <div style="flex:1;height:1px;background:rgba(120,170,190,.16);"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:11px;">
      <div style="height:50px;border-radius:11px;border:1px solid rgba(120,170,190,.22);display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px/1 'Gothic A1',sans-serif;color:#dbe4ea;white-space:nowrap;"><div style="width:16px;height:16px;border-radius:999px;background:#ffd23f;"></div>소셜 계정으로 계속</div>
      <div style="height:50px;border-radius:11px;border:1px solid rgba(120,170,190,.22);display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px/1 'Gothic A1',sans-serif;color:#dbe4ea;white-space:nowrap;"><div style="width:16px;height:16px;border-radius:4px;background:#3fd18a;"></div>관리인 계정으로 계속</div>
    </div>
    <p style="margin:26px 0 0;font:400 12px/1.7 'Gothic A1',sans-serif;color:#6b7a88;">계속하면 이용약관과 개인정보 처리방침에 동의하게 됩니다. 만 19세 이상, 그리고 살아 있는 분만 가입할 수 있습니다.</p>
  </div>
</main>
</body>
</html>
